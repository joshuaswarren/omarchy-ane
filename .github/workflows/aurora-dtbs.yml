name: aurora-dtbs

# The data-only overlays (packaging/dt/*-ane-dataonly.dts, docs/ane-soc-data.md)
# against the aurora-silicon/linux aurora-wip board device trees, which have the
# M3 and later boards that linux-asahi lacks. tools/asahi-dtbs builds them with
# that tree's dtc 1.7.2; the sparse clone is cached by the aurora-wip commit.
# A SoC with no board device tree there is a notice. The promotion gate does not
# depend on this workflow; dt-overlays.yml is the fast check.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/dt/**
      - data/ane-soc/**
      - tools/asahi-dtbs
      - tools/test_ane_overlays.py
      - .github/workflows/aurora-dtbs.yml
  pull_request:
    paths:
      - packaging/dt/**
      - data/ane-soc/**
      - tools/asahi-dtbs
      - tools/test_ane_overlays.py
      - .github/workflows/aurora-dtbs.yml

jobs:
  data-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # fdtget; dtc and fdtoverlay come from the kernel tree.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends device-tree-compiler flex bison
      - id: aurora
        run: echo "sha=$(git ls-remote https://github.com/aurora-silicon/linux refs/heads/aurora-wip | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aurora/linux
          key: aurora-wip-${{ steps.aurora.outputs.sha }}
      - name: data-only overlays on the aurora-wip board device trees
        run: |
          tools/asahi-dtbs "$RUNNER_TEMP/aurora" https://github.com/aurora-silicon/linux aurora-wip
          git -C "$RUNNER_TEMP/aurora/linux" log -1 --format='aurora-wip %H %cs'
          export PATH="$RUNNER_TEMP/aurora/bin:$PATH"
          ANE_DTBS="$RUNNER_TEMP/aurora/dtbs" python3 tools/test_ane_overlays.py --data-only
