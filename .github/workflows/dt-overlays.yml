name: dt-overlays

# The ANE device tree overlays against every linux-asahi board device tree they
# select (tools/asahi-dtbs, tools/test_ane_overlays.py), plus the offline
# omarchy-ane-dt, omarchy-ane-check, omarchy-ane-smoke, omarchy-ane-firmware-fetch and T8112 kit
# checks, the driver alias tables against the default overlays
# (tools/test_ane_m2.py), the boot regression of ane/t6021 (images, iBoot
# patches, ASC tunables), the libane host checks (make check: ane-selfcheck
# and the ioctl argument check against a fake DRM node), and those offline
# suites again on the tree of every promote_chip flip (tools/test_promote_chip.py). The ane-soc-data job
# checks data/ane-soc/*.json and the README data-only table
# (docs/ane-soc-data.md); the overlays job compiles and applies the data-only
# overlays where a linux-asahi board device tree exists. The overlays job also
# runs dkms against dkms.conf (tools/test_dkms_exclusive.py).
on:
  push:
    branches: [main]
    paths:
      - Makefile
      - fixtures/**
      - libane/**
      - tools/**
      - packaging/**
      - data/ane-soc/**
      - tests/fixtures/ane-soc/**
      - README.md
      - ane/src/**
      - ane/include/**
      - ane/ane_stats_show.c
      - ane/t6021/**
      - ane/h18/**
      - ane/h15/**
      - docs/ane-constants-t6021-t8152.md
      - dkms.conf
      - .github/workflows/dt-overlays.yml
  pull_request:
    paths:
      - Makefile
      - fixtures/**
      - libane/**
      - tools/**
      - packaging/**
      - data/ane-soc/**
      - tests/fixtures/ane-soc/**
      - README.md
      - ane/src/**
      - ane/include/**
      - ane/ane_stats_show.c
      - ane/t6021/**
      - ane/h18/**
      - ane/h15/**
      - docs/ane-constants-t6021-t8152.md
      - dkms.conf
      - .github/workflows/dt-overlays.yml

# Explicit bash enables pipefail, so a failed regression cannot pass via tail.
defaults:
  run:
    shell: bash

jobs:
  ane-soc-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: data/ane-soc schema, its tests, the README data-only table
        run: |
          python3 tools/validate_ane_soc.py data/ane-soc/*.json tests/fixtures/ane-soc/*.json
          python3 tools/test_validate_ane_soc.py
          python3 tools/gen_coverage_table.py --check
          python3 tools/test_ane_constants_table.py

  overlays:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: DTB source selection (offline, no compilation)
        run: python3 tools/test_asahi_dtbs.py
      # fdtget and fdtput; dtc and fdtoverlay come from the kernel tree. dkms
      # for tools/test_dkms_exclusive.py.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends device-tree-compiler flex bison libdrm-dev dkms
      - run: tools/asahi-dtbs "$RUNNER_TEMP/asahi"
      - name: tests (kernel dtc 1.7.2, libfdt linked in)
        run: |
          export PATH="$RUNNER_TEMP/asahi/bin:$PATH"
          dtc --version
          # make check first: it is timing-sensitive on 2-core runners and must
          # not run after the heavier python suites (promote_chip flips trees)
          make check
          python3 tools/test_ane_dt.py
          python3 tools/test_ane_firmware_fetch.py
          ANE_DTBS="$RUNNER_TEMP/asahi/dtbs" python3 tools/test_ane_m2.py
          python3 tools/test_t8112_kit.py
          ANE_DTBS="$RUNNER_TEMP/asahi/dtbs" python3 tools/test_ane_overlays.py
          python3 tools/test_promotion_check.py
          python3 tools/test_ane_intree.py
          python3 tools/test_aurora_dt.py
          python3 tools/test_promote_from_verdict.py
          python3 tools/test_ane_smoke.py
          python3 tools/test_ane_probe.py
          python3 tools/test_dkms_exclusive.py
          gcc -Wall -Wextra -O2 -I ane/t6021 -o "$RUNNER_TEMP/h14_boot_regression" tools/h14_boot_regression.c
          "$RUNNER_TEMP/h14_boot_regression" | tail -1
          # every promote_chip flip: the flip-sensitive suites above on each flipped tree
          ANE_DTBS="$RUNNER_TEMP/asahi/dtbs" python3 tools/test_promote_chip.py
