name: dt-overlays

# The ANE device tree overlays against every linux-asahi board device tree they
# select (tools/asahi-dtbs, tools/test_ane_overlays.py), plus the offline
# omarchy-ane-dt, omarchy-ane-check, omarchy-ane-smoke, omarchy-ane-firmware-fetch and T8112 kit
# checks, the driver alias tables against the default overlays
# (tools/test_ane_m2.py), the boot regression of ane/t6021 (images, iBoot
# patches, ASC tunables), and the libane host checks (make check: ane-selfcheck
# and the ioctl argument check against a fake DRM node). The ane-soc-data job
# checks data/ane-soc/*.json and the README data-only table
# (docs/ane-soc-data.md); the overlays job compiles and applies the data-only
# overlays where a linux-asahi board device tree exists.
on:
  push:
    branches: [main]
    paths:
      - libane/**
      - tools/Makefile
      - tools/test_libane_ioctl.c
      - packaging/**
      - data/ane-soc/**
      - tests/fixtures/ane-soc/**
      - tools/validate_ane_soc.py
      - tools/test_validate_ane_soc.py
      - tools/gen_coverage_table.py
      - README.md
      - ane/src/ane_drv.c
      - ane/t6021/**
      - tools/h14_boot_regression.c
      - tools/asahi-dtbs
      - tools/test_ane_dt.py
      - tools/test_ane_firmware_fetch.py
      - tools/test_ane_m2.py
      - tools/test_ane_overlays.py
      - tools/test_t8112_kit.py
      - tools/t8112-kit/**
      - tools/promotion_check.py
      - tools/promote_chip.py
      - tools/test_promotion_check.py
      - tools/test_promote_chip.py
      - tools/test_ane_smoke.py
      - .github/workflows/dt-overlays.yml
  pull_request:
    paths:
      - libane/**
      - tools/Makefile
      - tools/test_libane_ioctl.c
      - packaging/**
      - data/ane-soc/**
      - tests/fixtures/ane-soc/**
      - tools/validate_ane_soc.py
      - tools/test_validate_ane_soc.py
      - tools/gen_coverage_table.py
      - README.md
      - ane/src/ane_drv.c
      - ane/t6021/**
      - tools/h14_boot_regression.c
      - tools/asahi-dtbs
      - tools/test_ane_dt.py
      - tools/test_ane_firmware_fetch.py
      - tools/test_ane_m2.py
      - tools/test_ane_overlays.py
      - tools/test_t8112_kit.py
      - tools/t8112-kit/**
      - tools/promotion_check.py
      - tools/promote_chip.py
      - tools/test_promotion_check.py
      - tools/test_promote_chip.py
      - tools/test_ane_smoke.py
      - .github/workflows/dt-overlays.yml

jobs:
  ane-soc-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: data/ane-soc schema, its tests, the README data-only table
        run: |
          python3 tools/validate_ane_soc.py data/ane-soc/*.json tests/fixtures/ane-soc/*.json
          python3 tools/test_validate_ane_soc.py
          python3 tools/gen_coverage_table.py --check

  overlays:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # fdtget and fdtput; dtc and fdtoverlay come from the kernel tree.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends device-tree-compiler flex bison libdrm-dev
      - run: tools/asahi-dtbs "$RUNNER_TEMP/asahi"
      - name: tests (kernel dtc 1.7.2, libfdt linked in)
        run: |
          export PATH="$RUNNER_TEMP/asahi/bin:$PATH"
          dtc --version
          # make check first: it is timing-sensitive on 2-core runners and must
          # not run after the heavier python suites (promote_chip flips trees)
          make check
          python3 tools/test_ane_dt.py
          python3 tools/test_ane_firmware_fetch.py
          ANE_DTBS="$RUNNER_TEMP/asahi/dtbs" python3 tools/test_ane_m2.py
          python3 tools/test_t8112_kit.py
          ANE_DTBS="$RUNNER_TEMP/asahi/dtbs" python3 tools/test_ane_overlays.py
          python3 tools/test_promotion_check.py
          python3 tools/test_ane_smoke.py
          gcc -Wall -Wextra -O2 -I ane/t6021 -o "$RUNNER_TEMP/h14_boot_regression" tools/h14_boot_regression.c
          "$RUNNER_TEMP/h14_boot_regression" | tail -1
