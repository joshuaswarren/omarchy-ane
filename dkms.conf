# DKMS build of the ANE drivers from ane/: ane.ko (M1 family) and
# ane_t6021.ko (M2 Max, DRM ABI 2).
#
# Chip gate: ane.ko's own table (ane_of_match in ane/src/ane_drv.c) decides
# which SoC binds. T8103 and T6000/T6001 are qualified and bind. T6021 is
# recognized-untested and refuses unless ane.allow_unqualified=1. T6020 refuses.
#
# ane_t6021.ko is built and installed, but it does not load by default:
# packaging/modprobe/ane_t6021.conf makes its autoload run /bin/false.
# Once it starts the ANE firmware, only a reboot unloads it, so it loads
# only after omarchy-ane-m2-enable lifts that block.
#
# Source tree: this file, ane/Makefile, ane/src/ and ane/t6021/. The recipe
# replaces @PKGVER@; the same string becomes /sys/module/ane/version (no .git
# here).
PACKAGE_NAME="omarchy-ane"
PACKAGE_VERSION="@PKGVER@"
# Call kbuild directly: DKMS passes KERNELRELEASE, which sends ane/Makefile
# down its kbuild branch, so "make -C ane" has no modules target.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/ane ANE_VERSION=${PACKAGE_VERSION} modules && make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/ane/t6021 modules"
BUILT_MODULE_NAME[0]="ane"
BUILT_MODULE_LOCATION[0]="ane/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/accel"
BUILT_MODULE_NAME[1]="ane_t6021"
BUILT_MODULE_LOCATION[1]="ane/t6021/"
DEST_MODULE_LOCATION[1]="/kernel/drivers/accel"
AUTOINSTALL="yes"
