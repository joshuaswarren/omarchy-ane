# DKMS build of the production ANE driver, ane.ko, from ane/.
#
# Chip gate: ane.ko's own table (ane_of_match in ane/src/ane_drv.c) decides
# which SoC binds. T8103 and T6000/T6001 are qualified and bind. T6021 is
# recognized-untested and refuses unless ane.allow_unqualified=1. T6020 refuses.
#
# The T6021 lab modules in ane/t6021/ (ane_t6021, ane_t6021_rtclient) are
# excluded, not built-and-gated: ane/Makefile does not reach them, and an
# installed copy would autoload on every M2 through its of_match table. M2
# joins this build when its inference path qualifies.
#
# Source tree: this file, ane/Makefile and ane/src/. The recipe replaces
# @PKGVER@; the same string becomes /sys/module/ane/version (no .git here).
PACKAGE_NAME="omarchy-ane"
PACKAGE_VERSION="@PKGVER@"
# Call kbuild directly: DKMS passes KERNELRELEASE, which sends ane/Makefile
# down its kbuild branch, so "make -C ane" has no modules target.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/ane ANE_VERSION=${PACKAGE_VERSION} modules"
BUILT_MODULE_NAME[0]="ane"
BUILT_MODULE_LOCATION[0]="ane/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/accel"
AUTOINSTALL="yes"
