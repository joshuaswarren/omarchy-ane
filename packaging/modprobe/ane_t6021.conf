# omarchy-ane: ane_t6021 (M2 Max ANE) does not load until you opt in.
#
# Once ane_t6021 starts the ANE firmware, it cannot be unloaded: only a
# reboot releases it. To opt in, run: sudo omarchy-ane-m2-enable
# That command comments out the line below. pacman keeps your edits to this
# file.
install ane_t6021 /bin/false
