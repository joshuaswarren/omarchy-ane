# DartKernel one-shot entries (omarchy-ane receipts/2026-10-01-t6021-dart-kernel).
# GRUB sources this file after grub.cfg (41_custom). Nothing selects these entries except
# `grub-reboot <id>`: the default stays the stock entry, pinned by id in grub.cfg.
menuentry 'DartKernel T: stock kernel, one-shot test' --class os --id dart-oneshot-test {
	load_video
	set gfxpayload=keep
	insmod gzio
	insmod part_gpt
	insmod ext2
	search --no-floppy --fs-uuid --set=root 4f4d5801-424f-4f54-8000-000000000001
	linux	/vmlinuz-linux-asahi root=UUID=4f4d5801-524f-4f54-8000-000000000001 rw rootflags=subvol=@ zswap.enabled=0 rootfstype=btrfs quiet loglevel=3 splash ane_dart_oneshot=test panic=30 systemd.watchdog_sec=120 systemd.crash_action=reboot
	initrd	/initramfs-linux-asahi.img
}
menuentry 'DartKernel C: 7.1.13-3-1-ARCH-dart, ane_tunables=0' --class os --id dart-ctl {
	load_video
